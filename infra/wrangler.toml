name = "eaton-ehs-api"
main = "worker-api.mjs"
compatibility_date = "2024-09-01"
account_id = "37821191a8c1419e055c2c0a30546589"

[[d1_databases]]
binding = "DB"
database_name = "eaton-ehs-dashboard"
database_id = "62ce85d7-0cc1-4832-aa57-d5b09ceaa132"

# Auth token lives in Cloudflare Secrets Store, bound as AUTH_TOKEN (the worker
# reads env.AUTH_TOKEN.get(), falling back to the API_TOKEN secret). Declared here
# so `wrangler deploy` keeps the binding instead of tearing it out.
[[secrets_store_secrets]]
binding = "AUTH_TOKEN"
store_id = "80c48360a0e54dd69425da2dfbde21ad"
secret_name = "EATON_TOKEN"

# Semantic search (v3.9.0+). The Vectorize index must exist BEFORE deploying
# with these bindings or the deploy fails:
#   npx wrangler vectorize create eaton-memory --dimensions=768 --metric=cosine
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "eaton-memory"

[triggers]
# FRI 14:00 UTC — weekly digest email. MON 12:00 UTC — D1 backup to GitHub.
# FRI 21:00 UTC (5pm ET) — auto-draft the weekly reflection if /weekly didn't
# already write one. Runs after the digest and after Charlie's own Friday review.
#
# Day-of-week is SPELLED OUT, never numeric. Cloudflare cron is Quartz-style:
# 1 = Sunday, 7 = Saturday — NOT the POSIX 0 = Sunday this file originally
# assumed. The numeric originals ("0 14 * * 5" etc.) fired a day early for
# weeks — Thursday digests, Sunday backups — and the drift was invisible
# because every run "succeeded" (kb/lessons.md 2026-08-02).
#
# Every cron listed here MUST have an explicit `case` in the worker's scheduled()
# switch, matching this string EXACTLY (controller.cron is the literal expression
# as registered). An unhandled trigger throws by design rather than falling
# through to another job's handler — see the v3.10.0 changelog note.
crons = ["0 14 * * FRI", "0 12 * * MON", "0 21 * * FRI"]
