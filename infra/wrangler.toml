name = "eaton-ehs-api"
main = "worker-api.mjs"
compatibility_date = "2024-09-01"
account_id = "37821191a8c1419e055c2c0a30546589"

[[d1_databases]]
binding = "DB"
database_name = "eaton-ehs-dashboard"
database_id = "62ce85d7-0cc1-4832-aa57-d5b09ceaa132"

# Auth token lives in Cloudflare Secrets Store, bound as AUTH_TOKEN (the worker
# reads env.AUTH_TOKEN.get(), falling back to the API_TOKEN secret). Fill in the
# real store_id + secret_name from the worker's Bindings tab before deploying with
# wrangler — otherwise the binding drops and auth silently falls back to API_TOKEN.
# [[secrets_store_secrets]]
# binding = "AUTH_TOKEN"
# store_id = "<from the worker's Bindings tab>"
# secret_name = "<from the worker's Bindings tab>"

[triggers]
crons = ["0 14 * * 5"]
