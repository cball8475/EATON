<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EHS CMD — Eaton Sumter</title>
<style>
  /* ── Reset & Base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1114; --bg2: #181b20; --bg3: #1e2228; --bg4: #252a31;
    --border: #2a2f38; --border2: #353b45;
    --text: #e2e4e8; --text2: #9ba1ab; --text3: #6b7280;
    --red: #ef4444; --amber: #f59e0b; --teal: #10b981; --blue: #3b82f6;
    --red-bg: #ef444418; --amber-bg: #f59e0b18; --teal-bg: #10b98118; --blue-bg: #3b82f618;
    --purple: #a78bfa; --purple-bg: #a78bfa18;
    --orange: #f97316; --orange-bg: #f9731618;
    --font: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
    --font-body: 'Inter', -apple-system, sans-serif;
    --radius: 6px;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  a { color: var(--blue); text-decoration: none; }
  input, select, textarea, button { font-family: inherit; font-size: inherit; }

  /* ── Layout ── */
  .shell { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .header h1 { font-family: var(--font); font-size: 16px; font-weight: 500; letter-spacing: 0.02em; }
  .header h1 span { color: var(--teal); }
  .header-right { display: flex; gap: 8px; align-items: center; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 2px; background: var(--bg2); border-radius: var(--radius); padding: 2px; margin-bottom: 16px; border: 1px solid var(--border); }
  .tab { padding: 7px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text3); transition: all 0.15s; background: transparent; border: none; }
  .tab:hover { color: var(--text2); }
  .tab.active { background: var(--bg4); color: var(--text); }
  .panel { display: none; }
  .panel.active { display: block; }

  /* ── Stats Row ── */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
  .stat-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin-bottom: 4px; }
  .stat-value { font-family: var(--font); font-size: 22px; font-weight: 500; }
  .stat-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

  /* ── Kanban ── */
  .kanban { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; min-height: 400px; }
  @media (max-width: 900px) { .kanban { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .kanban { grid-template-columns: 1fr; } }
  .column { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; }
  .col-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
  .col-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); }
  .col-count { font-family: var(--font); font-size: 11px; color: var(--text3); background: var(--bg4); padding: 1px 6px; border-radius: 3px; }
  .col-cards { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 500px; }
  .week-divider { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--teal); padding: 6px 4px 2px; border-bottom: 1px solid var(--border); margin-top: 4px; }

  /* ── Task Cards ── */
  .task-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; cursor: pointer; transition: border-color 0.15s; }
  .task-card:hover { border-color: var(--border2); }
  .task-card.priority-High { border-left: 2px solid var(--red); }
  .task-card.priority-Medium { border-left: 2px solid var(--amber); }
  .task-card.priority-Low { border-left: 2px solid var(--teal); }
  .task-card.fyi-card { opacity: 0.6; }
  .task-title { font-size: 13px; font-weight: 500; margin-bottom: 4px; line-height: 1.3; }
  .task-meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .task-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--bg4); color: var(--text3); }
  .task-tag.overdue { background: var(--red-bg); color: var(--red); }
  .task-tag.due-soon { background: var(--amber-bg); color: var(--amber); }
  .task-tag.blocked { background: var(--orange-bg); color: var(--orange); }
  .task-tag.fyi { background: var(--bg4); color: var(--text3); font-style: italic; }
  .task-tag.period { background: var(--blue-bg); color: var(--blue); }
  .task-tag.tribal { background: var(--purple-bg); color: var(--purple); }
  .task-assignee { font-size: 10px; color: var(--blue); }
  .task-source { font-size: 10px; color: var(--text3); font-style: italic; }
  .task-id { font-family: var(--font); font-size: 10px; color: var(--text3); margin-right: 4px; }

  /* ── Task Detail Modal ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #000a; z-index: 100; justify-content: center; align-items: flex-start; padding: 60px 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 560px; max-height: 80vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .modal-header h3 { font-size: 15px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; }
  .modal-body { padding: 16px; }
  .modal-body .field { margin-bottom: 12px; }
  .modal-body .field label { display: block; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .modal-body .field input, .modal-body .field select, .modal-body .field textarea {
    width: 100%; padding: 7px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text); outline: none;
  }
  .modal-body .field textarea { min-height: 60px; resize: vertical; }
  .modal-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); justify-content: space-between; }
  .section-divider { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text3); margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid var(--border); }

  /* ── Buttons ── */
  .btn { padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
  .btn:hover { background: var(--bg4); border-color: var(--border2); }
  .btn-primary { background: var(--teal); color: #000; border-color: var(--teal); }
  .btn-primary:hover { opacity: 0.85; }
  .btn-danger { background: var(--red-bg); color: var(--red); border-color: #ef444444; }
  .btn-sm { padding: 4px 8px; font-size: 11px; }

  /* ── People Grid ── */
  .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .person-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s; }
  .person-card:hover { border-color: var(--border2); }
  .person-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 14px 8px; }
  .person-name { font-size: 14px; font-weight: 600; }
  .person-role { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .person-dept { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-weight: 500; }
  .dept-EHS { background: var(--teal-bg); color: var(--teal); }
  .dept-Operations { background: var(--amber-bg); color: var(--amber); }
  .dept-Supply { background: var(--blue-bg); color: var(--blue); }
  .dept-CI { background: var(--purple-bg); color: var(--purple); }
  .dept-Leadership { background: var(--red-bg); color: var(--red); }
  .dept-Security { background: #f9731618; color: #f97316; }
  .dept-Logistics { background: var(--blue-bg); color: var(--blue); }
  .dept-default { background: var(--bg4); color: var(--text3); }
  .person-body { padding: 0 14px 12px; }
  .person-field { margin-bottom: 6px; }
  .person-field-label { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); }
  .person-field-value { font-size: 12px; color: var(--text2); line-height: 1.4; }
  .reliability-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500; }
  .rel-proven { background: var(--teal-bg); color: var(--teal); }
  .rel-emerging { background: var(--amber-bg); color: var(--amber); }
  .rel-watching { background: var(--bg4); color: var(--text3); }
  .person-warning { background: var(--red-bg); border: 1px solid #ef444433; border-radius: 4px; padding: 6px 10px; margin-top: 6px; font-size: 11px; color: var(--red); line-height: 1.4; }
  .person-tasks-count { font-size: 11px; color: var(--text3); }

  /* ── Otter Extract ── */
  .otter-area { max-width: 700px; }
  .otter-area textarea { width: 100%; min-height: 200px; padding: 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); resize: vertical; font-family: var(--font); font-size: 12px; }
  .extracted-list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .extracted-item { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .extracted-info { flex: 1; }
  .extracted-title { font-size: 13px; font-weight: 500; }
  .extracted-desc { font-size: 12px; color: var(--text3); }

  /* ── Metrics Section ── */
  .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .metric-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); margin-bottom: 10px; }
  .metric-big { font-family: var(--font); font-size: 32px; font-weight: 500; }
  .metric-big.green { color: var(--teal); }
  .metric-big.amber { color: var(--amber); }
  .metric-big.red { color: var(--red); }
  .metric-big.blue { color: var(--blue); }
  .metric-detail { font-size: 12px; color: var(--text3); margin-top: 4px; line-height: 1.5; }
  .metric-bar { height: 6px; background: var(--bg4); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .metric-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }

  .metric-source { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 6px; vertical-align: middle; font-weight: 500; letter-spacing: 0.03em; }
  .source-validated { background: var(--teal-bg); color: var(--teal); }
  .source-conv { background: var(--purple-bg); color: var(--purple); }
  .metric-row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; }
  .metric-row-label { font-size: 12px; color: var(--text3); }
  .metric-row-value { font-family: var(--font); font-size: 13px; font-weight: 500; }
  .metric-divider { border-top: 1px solid var(--border); margin: 8px 0; }
  .metric-section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }

  /* ── Filter Bar ── */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .filter-bar input, .filter-bar select { padding: 5px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; }
  .filter-bar input { min-width: 180px; }

  /* ── Bottom Zones (Waiting On + FYI) ── */
  .bottom-zones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 900px) { .bottom-zones { grid-template-columns: 1fr; } }
  .zone-panel { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .zone-waiting { border-top: 2px solid var(--orange); }
  .zone-fyi { border-top: 2px solid var(--text3); }
  .zone-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .zone-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text2); display: flex; align-items: center; gap: 6px; }
  .zone-icon { font-size: 14px; }
  .zone-count { font-family: var(--font); font-size: 11px; color: var(--text3); background: var(--bg4); padding: 1px 7px; border-radius: 3px; }
  .zone-body { padding: 8px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .zone-body:empty::after { content: "Nothing here"; display: block; text-align: center; color: var(--text3); font-size: 12px; padding: 16px; }
  .zone-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: border-color 0.15s; gap: 8px; }
  .zone-item:hover { border-color: var(--border2); }
  .zone-item-left { flex: 1; min-width: 0; }
  .zone-item-title { font-size: 13px; font-weight: 500; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .zone-item-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .zone-item-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .zone-item.priority-High { border-left: 2px solid var(--red); }
  .zone-item.priority-Medium { border-left: 2px solid var(--amber); }
  .zone-item.priority-Low { border-left: 2px solid var(--teal); }
  .waiting-who { font-size: 11px; font-weight: 500; color: var(--orange); background: var(--orange-bg); padding: 1px 6px; border-radius: 3px; }
  .fyi-status { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--bg4); color: var(--text3); }

  /* ── Top 5 Focus Tile ── */
  .focus-tile { background: var(--bg2); border: 1px solid var(--border); border-top: 2px solid var(--teal); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .focus-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .focus-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--teal); display: flex; align-items: center; gap: 6px; }
  .focus-week { font-size: 11px; color: var(--text3); font-weight: 400; text-transform: none; letter-spacing: normal; }
  .focus-list { padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; }
  .focus-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 6px; border-radius: 4px; transition: background 0.15s; }
  .focus-item:hover { background: var(--bg3); }
  .focus-num { font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--teal); min-width: 18px; text-align: right; flex-shrink: 0; line-height: 1.4; }
  .focus-content { flex: 1; min-width: 0; }
  .focus-label { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.4; }
  .focus-desc { font-size: 12px; color: var(--text3); line-height: 1.4; margin-top: 1px; }
  .focus-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle; }

  /* ── Onboarding Tile ── */
  .onboard-tile { background: var(--bg2); border: 1px solid var(--border); border-top: 2px solid var(--blue); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .onboard-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .onboard-header:hover { background: var(--bg3); }
  .onboard-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--blue); display: flex; align-items: center; gap: 6px; }
  .onboard-toggle { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
  .onboard-toggle.collapsed { transform: rotate(-90deg); }
  .onboard-progress { display: flex; align-items: center; gap: 10px; }
  .onboard-progress-bar { width: 100px; height: 6px; background: var(--bg4); border-radius: 3px; overflow: hidden; }
  .onboard-progress-fill { height: 100%; background: var(--blue); border-radius: 3px; transition: width 0.4s; }
  .onboard-progress-text { font-family: var(--font); font-size: 11px; color: var(--text3); }
  .onboard-body { padding: 8px 10px; }
  .onboard-body.hidden { display: none; }
  .onboard-phase { margin-bottom: 10px; }
  .onboard-phase:last-child { margin-bottom: 0; }
  .onboard-phase-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 4px; padding: 2px 0; display: flex; align-items: center; gap: 6px; }
  .onboard-phase-count { font-family: var(--font); font-size: 10px; color: var(--text3); background: var(--bg4); padding: 0px 5px; border-radius: 3px; }
  .onboard-items { display: flex; flex-direction: column; gap: 3px; }
  .onboard-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: border-color 0.15s; gap: 8px; }
  .onboard-item:hover { border-color: var(--border2); }
  .onboard-item.done { opacity: 0.4; }
  .onboard-item-title { font-size: 12px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .onboard-item-status { font-size: 10px; padding: 1px 6px; border-radius: 3px; flex-shrink: 0; font-weight: 500; }
  .ob-todo { background: var(--amber-bg); color: var(--amber); }
  .ob-wip { background: var(--blue-bg); color: var(--blue); }
  .ob-done { background: var(--teal-bg); color: var(--teal); }

  /* ── Overdue Tile ── */
  .overdue-tile { background: var(--bg2); border: 1px solid var(--border); border-top: 2px solid var(--red); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .overdue-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
  .overdue-header:hover { background: var(--bg3); }
  .overdue-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--red); display: flex; align-items: center; gap: 6px; }
  .overdue-toggle { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
  .overdue-toggle.collapsed { transform: rotate(-90deg); }
  .overdue-body { padding: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 350px; overflow-y: auto; }
  .overdue-body.hidden { display: none; }
  .overdue-age { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin: 4px 0 2px 4px; }
  .days-badge { font-family: var(--font); font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500; }
  .days-badge.urgent { background: var(--red-bg); color: var(--red); }
  .days-badge.warning { background: var(--amber-bg); color: var(--amber); }
  .days-badge.stale { background: var(--orange-bg); color: var(--orange); }

  /* ── Intel Badge on Task Cards ── */
  .intel-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 1px 5px; border-radius: 3px; background: var(--purple-bg); color: var(--purple); cursor: help; }
  .intel-tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 0; right: 0; background: var(--bg2); border: 1px solid var(--purple); border-radius: 4px; padding: 8px 10px; font-size: 11px; color: var(--text2); line-height: 1.4; z-index: 50; white-space: normal; box-shadow: 0 4px 12px #0008; }
  .intel-tip .intel-label { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--purple); margin-bottom: 2px; }
  .task-card { position: relative; }
  .task-card:hover .intel-tip { display: block; }

  /* ── FYI Archive Toggle ── */
  .fyi-toggle { font-size: 10px; padding: 2px 8px; border-radius: 3px; background: var(--bg4); color: var(--text3); border: 1px solid var(--border); cursor: pointer; font-weight: 500; }
  .fyi-toggle:hover { color: var(--text2); border-color: var(--border2); }
  .fyi-archived-count { font-size: 10px; color: var(--text3); margin-left: 4px; }

  /* ── Loading ── */
  .loading { text-align: center; padding: 40px; color: var(--text3); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.6s linear infinite; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="shell" id="app">
  <!-- Header -->
  <div class="header">
    <h1><span>EHS</span> CMD <span style="color:var(--text3);font-size:11px;margin-left:6px;">Eaton Sumter</span></h1>
    <div class="header-right">
      <button class="btn btn-sm" onclick="exportJSON()">↓ Export</button>
      <button class="btn btn-sm" onclick="refreshAll()">↻ Refresh</button>
      <button class="btn btn-sm btn-primary" onclick="openNewTask()">+ Task</button>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="stats-row" id="stats-row"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('board')">Board</button>
    <button class="tab" onclick="switchTab('people')">People</button>
    <button class="tab" onclick="switchTab('metrics')">EHS Metrics</button>
    <button class="tab" onclick="switchTab('otter')">Otter Extract</button>
  </div>

  <!-- Board Panel -->
  <div class="panel active" id="panel-board">
    <!-- Filter bar — applies to My Tasks kanban -->
    <div class="filter-bar">
      <input type="text" id="search-tasks" placeholder="Search tasks..." oninput="renderBoard()">
      <select id="filter-period" onchange="renderBoard()">
        <option value="">All periods</option>
        <option value="this-week">This week</option>
        <option value="30-day">30-day</option>
        <option value="60-day">60-day</option>
        <option value="90-day">90-day</option>
        <option value="ongoing">Ongoing</option>
      </select>
      <select id="filter-priority" onchange="renderBoard()">
        <option value="">All priorities</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <select id="filter-source" onchange="renderBoard()">
        <option value="">All sources</option>
      </select>
    </div>

    <!-- OVERDUE TILE — collapsible, at top of board -->
    <div class="overdue-tile" id="overdue-tile" style="display:none;"></div>

    <!-- TOP 5 FOCUSES — always visible at top of board -->
    <div class="focus-tile" id="focus-tile"></div>

    <!-- ZONE 1: My Tasks kanban -->
    <div class="kanban" id="kanban"></div>

    <!-- Onboarding Tracker — separate from task kanban -->
    <div class="onboard-tile" id="onboard-tile"></div>

    <!-- ZONE 2: Waiting On + ZONE 3: FYI — side by side on wide, stacked on narrow -->
    <div class="bottom-zones">
      <div class="zone-panel zone-waiting" id="zone-waiting">
        <div class="zone-header">
          <span class="zone-title"><span class="zone-icon" style="color:var(--orange);">⏳</span> Waiting On</span>
          <span class="zone-count" id="waiting-count">0</span>
        </div>
        <div class="zone-body" id="waiting-list"></div>
      </div>
      <div class="zone-panel zone-fyi" id="zone-fyi">
        <div class="zone-header">
          <span class="zone-title"><span class="zone-icon" style="color:var(--text3);">👁</span> FYI / Tracking</span>
          <div style="display:flex;align-items:center;gap:6px;">
            <button class="fyi-toggle" id="fyi-archive-toggle" onclick="toggleFyiArchive()">Show archived</button>
            <span class="fyi-archived-count" id="fyi-archived-count"></span>
            <span class="zone-count" id="fyi-count">0</span>
          </div>
        </div>
        <div class="zone-body" id="fyi-list"></div>
      </div>
    </div>
  </div>

  <!-- People Panel -->
  <div class="panel" id="panel-people">
    <div class="filter-bar">
      <input type="text" id="search-people" placeholder="Search people..." oninput="renderPeople()">
      <select id="filter-dept" onchange="renderPeople()">
        <option value="">All departments</option>
      </select>
      <select id="filter-reliability" onchange="renderPeople()">
        <option value="">All reliability</option>
        <option value="proven">Proven</option>
        <option value="emerging">Emerging</option>
        <option value="watching">Watching</option>
      </select>
    </div>
    <div class="people-grid" id="people-grid"></div>
  </div>

  <!-- Metrics Panel -->
  <div class="panel" id="panel-metrics">
    <div class="metrics-grid" id="metrics-grid"></div>
  </div>

  <!-- Otter Panel -->
  <div class="panel" id="panel-otter">
    <div class="otter-area">
      <p style="font-size:12px;color:var(--text3);margin-bottom:8px;">Paste an Otter.ai transcript below. AI will extract action items as tasks and leadership moves.</p>
      <textarea id="otter-input" placeholder="Paste transcript here..."></textarea>
      <div style="margin-top:8px;display:flex;gap:8px;">
        <button class="btn btn-primary" id="otter-btn" onclick="extractOtter()">Extract Tasks</button>
        <span id="otter-status" style="font-size:12px;color:var(--text3);align-self:center;"></span>
      </div>
      <div class="extracted-list" id="extracted-list"></div>
    </div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="modal-overlay" id="task-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Task</h3>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Title</label><input id="m-title" type="text"></div>
      <div class="field"><label>Description</label><textarea id="m-desc"></textarea></div>
      <div class="field"><label>Notes</label><textarea id="m-notes"></textarea></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field"><label>Priority</label><select id="m-priority"><option>High</option><option>Medium</option><option>Low</option></select></div>
        <div class="field"><label>Status</label><select id="m-status"><option value="todo">To Do</option><option value="wip">WIP</option><option value="done">Done</option><option value="projects">Projects</option><option value="undated">Undated</option></select></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field"><label>Due Date</label><input id="m-due" type="date"></div>
        <div class="field"><label>Assignee</label><select id="m-assignee"></select></div>
      </div>
      <div class="field"><label>Tags</label><input id="m-tags" type="text" placeholder="comma-separated"></div>

      <!-- New fields section -->
      <div class="section-divider">Tracking</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field">
          <label>Ownership</label>
          <select id="m-ownership">
            <option value="mine">Mine</option>
            <option value="fyi">FYI (tracking only)</option>
          </select>
        </div>
        <div class="field">
          <label>Target Period</label>
          <select id="m-target-period">
            <option value="">Not set</option>
            <option value="this-week">This week</option>
            <option value="30-day">30-day</option>
            <option value="60-day">60-day</option>
            <option value="90-day">90-day</option>
            <option value="ongoing">Ongoing</option>
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field">
          <label>Waiting On</label>
          <input id="m-waiting-on" type="text" placeholder="Person or thing blocking this">
        </div>
        <div class="field">
          <label>Knowledge Type</label>
          <select id="m-knowledge-type">
            <option value="">Not set</option>
            <option value="documented">Documented</option>
            <option value="tribal-knowledge">Tribal knowledge</option>
          </select>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <div class="field"><label>Source</label><input id="m-source-label" type="text" placeholder="e.g. Kate 1-on-1 May 7" readonly style="opacity:0.6;"></div>
        <div class="field"><label>Meeting ID</label><input id="m-source-meeting-id" type="text" placeholder="Otter meeting ID" readonly style="opacity:0.6;"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger" id="modal-delete" onclick="deleteTask()">Delete</button>
      <div style="display:flex;gap:8px;">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveTask()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Completion Modal — shown when marking a task done -->
<div class="modal-overlay" id="complete-modal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h3 style="color:var(--teal);">✓ Closing Task</h3>
      <button class="modal-close" onclick="skipComplete()">&times;</button>
    </div>
    <div class="modal-body">
      <div id="complete-task-title" style="font-size:13px;color:var(--text2);margin-bottom:12px;padding:8px;background:var(--bg3);border-radius:4px;"></div>
      <div class="field">
        <label>Outcome</label>
        <select id="c-outcome">
          <option value="">— select —</option>
          <option value="no issues">No issues</option>
          <option value="findings documented">Findings documented</option>
          <option value="conversation">Conversation</option>
          <option value="delivered">Delivered / submitted</option>
          <option value="issue resolved">Issue resolved</option>
          <option value="no longer needed">No longer needed</option>
          <option value="transferred">Transferred</option>
        </select>
      </div>
      <div class="field">
        <label>Who was involved</label>
        <input id="c-who" type="text" placeholder="Names (optional)">
      </div>
      <div class="field">
        <label>One-liner</label>
        <input id="c-note" type="text" placeholder="Quick summary (optional)">
      </div>
    </div>

      <button class="btn" onclick="skipComplete()">Skip</button>
      <button class="btn btn-primary" onclick="confirmComplete()">Save & Close</button>
    </div>
  </div>
</div>

<script>
// ── Config ──
const API = "https://eaton-ehs-api.cball8475.workers.dev";
// The API token is NOT stored in source. It lives only in this browser's
// localStorage, so it never appears in the repo or the served page source.
// To set or replace it at any time, run in the browser console:  setToken("<token>")
let TOKEN = localStorage.getItem("eaton_token") || "";
function setToken(t) { TOKEN = (t || "").trim(); localStorage.setItem("eaton_token", TOKEN); location.reload(); }
function getHeaders() { return { "Content-Type": "application/json", "Authorization": `Bearer ${TOKEN}` }; }

// ── Token gate — inline UI (no blocking dialogs, never reload-loops) ──
function showTokenGate(msg) {
  let el = document.getElementById("token-gate");
  if (!el) {
    el = document.createElement("div");
    el.id = "token-gate";
    el.style.cssText = "position:fixed;inset:0;background:#0b0e14;display:flex;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,sans-serif;";
    el.innerHTML =
      '<div style="max-width:380px;width:90%;text-align:center;color:#e6e6e6;">' +
        '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">EHS CMD — API token</div>' +
        '<p id="token-gate-msg" style="font-size:13px;color:#9aa4b2;margin-bottom:14px;"></p>' +
        '<input id="token-gate-input" type="password" placeholder="Paste API token" ' +
          'style="width:100%;padding:10px;border-radius:6px;border:1px solid #2a3140;background:#11151c;color:#fff;margin-bottom:10px;box-sizing:border-box;" />' +
        '<button id="token-gate-btn" style="width:100%;padding:10px;border-radius:6px;border:0;background:#1f6feb;color:#fff;font-weight:600;cursor:pointer;">Save &amp; load</button>' +
      '</div>';
    document.body.appendChild(el);
    const save = () => {
      const v = document.getElementById("token-gate-input").value.trim();
      if (!v) return;
      TOKEN = v; localStorage.setItem("eaton_token", v);
      _authFailed = false; el.remove(); boot();
    };
    document.getElementById("token-gate-btn").onclick = save;
    document.getElementById("token-gate-input").addEventListener("keydown", e => { if (e.key === "Enter") save(); });
  }
  el.style.display = "flex";
  document.getElementById("token-gate-msg").textContent = msg || "Enter your token to load the dashboard. It is stored only in this browser.";
  document.getElementById("token-gate-input").focus();
}

async function boot() {
  if (!TOKEN) { showTokenGate(); return; }
  await refreshAll();
}

// ── State ──
let allTasks = [];
let allPeople = [];
let allIntel = [];
let scoreboard = {};
let editingTaskId = null;
let originalStatus = null;
let overdueCollapsed = false;
let showArchivedFyi = false;

// ── API helpers ──
let _authFailed = false;
async function api(path, method = "GET", body) {
  const opts = { method, headers: getHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (res.status === 401) {
    if (!_authFailed) {
      _authFailed = true;
      localStorage.removeItem("eaton_token"); TOKEN = "";
      showTokenGate("That token was rejected (401). Paste a valid token.");
    }
    return {};
  }
  return res.json();
}

// ── Init ──
// ── Top 5 Weekly Focuses — auto-generated from active tasks ──
function getWeekLabel() {
  const now = new Date();
  const day = now.getUTCDay();
  const mon = new Date(now);
  mon.setUTCDate(now.getUTCDate() - ((day + 6) % 7));
  const fri = new Date(mon);
  fri.setUTCDate(mon.getUTCDate() + 4);
  const mStr = mon.toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  const fStr = fri.toLocaleString("en-US", { day: "numeric", timeZone: "UTC" });
  return `${mStr}–${fStr}`;
}

function renderFocuses() {
  const tile = document.getElementById("focus-tile");
  const priOrder = { High: 0, Medium: 1, Low: 2 };
  const today = new Date().toISOString().split("T")[0];

  // Pick top 5 from: owned active tasks, prioritized by priority then due date proximity.
  // Exclude anything already surfaced in the Overdue tile so it isn't shown twice.
  const candidates = allTasks.filter(t =>
    t.ownership !== "fyi" &&
    (t.status === "todo" || t.status === "wip" || t.status === "projects") &&
    !isOnboarding(t) &&
    !(t.due_date && t.due_date < today)
  ).sort((a, b) => {
    // WIP first, then by priority, then by due date
    if (a.status === "wip" && b.status !== "wip") return -1;
    if (b.status === "wip" && a.status !== "wip") return 1;
    const pa = priOrder[a.priority] ?? 1, pb = priOrder[b.priority] ?? 1;
    if (pa !== pb) return pa - pb;
    // Overdue first, then soonest due
    const ad = a.due_date || "9999", bd = b.due_date || "9999";
    return ad.localeCompare(bd);
  });

  const top5 = candidates.slice(0, 5);
  if (!top5.length) { tile.style.display = "none"; return; }
  tile.style.display = "block";

  const tagInfo = (t) => {
    if (t.status === "wip") return { tag: "wip", color: "var(--blue)", bg: "var(--blue-bg)" };
    if (t.status === "projects") return { tag: "project", color: "var(--amber)", bg: "var(--amber-bg)" };
    if (t.target_period) return { tag: t.target_period, color: "var(--blue)", bg: "var(--blue-bg)" };
    return null;
  };

  tile.innerHTML = `
    <div class="focus-header">
      <span class="focus-title">🎯 Top 5 Priorities <span class="focus-week">Week of ${getWeekLabel()}</span></span>
    </div>
    <div class="focus-list">
      ${top5.map((t, i) => {
        const ti = tagInfo(t);
        const overdue = t.due_date && t.due_date < today && t.status !== "done";
        return `
        <div class="focus-item">
          <span class="focus-num">${i + 1}</span>
          <div class="focus-content">
            <span class="focus-label"><span class="task-id">#${t.id}</span> ${t.title}${overdue ? '<span class="focus-tag" style="background:var(--red-bg);color:var(--red);">overdue</span>' : ""}${ti ? `<span class="focus-tag" style="background:${ti.bg};color:${ti.color};">${ti.tag}</span>` : ""}</span>
            <div class="focus-desc">${t.description || ""} ${t.assignee_name && t.assignee_name !== "Charlie Ball" ? "· " + t.assignee_name : ""}</div>
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

// ── Overdue Tile — collapsible, sorted by age ──
function renderOverdue() {
  const tile = document.getElementById("overdue-tile");
  const today = new Date().toISOString().split("T")[0];
  const overdueTasks = allTasks.filter(t =>
    t.due_date && t.due_date < today && t.status !== "done" && t.ownership !== "fyi"
  ).sort((a, b) => a.due_date.localeCompare(b.due_date));

  if (!overdueTasks.length) { tile.style.display = "none"; return; }
  tile.style.display = "block";

  const daysBetween = (d1, d2) => Math.floor((new Date(d2) - new Date(d1)) / 86400000);

  // Group by age
  const groups = { critical: [], warning: [], aging: [] };
  overdueTasks.forEach(t => {
    const days = daysBetween(t.due_date, today);
    if (days >= 14) groups.critical.push({ ...t, daysOver: days });
    else if (days >= 7) groups.warning.push({ ...t, daysOver: days });
    else groups.aging.push({ ...t, daysOver: days });
  });

  const renderItem = (t) => `
    <div class="zone-item priority-${t.priority}" onclick="openTask(${t.id})">
      <div class="zone-item-left">
        <div class="zone-item-title"><span class="task-id">#${t.id}</span> ${t.title}</div>
        <div class="zone-item-sub">${t.assignee_name || ""} ${t.target_period ? "· " + t.target_period : ""}</div>
      </div>
      <div class="zone-item-right">
        <span class="days-badge ${t.daysOver >= 14 ? 'urgent' : t.daysOver >= 7 ? 'warning' : 'stale'}">${t.daysOver}d overdue</span>
      </div>
    </div>`;

  tile.innerHTML = `
    <div class="overdue-header" onclick="toggleOverdue()">
      <span class="overdue-title"><span style="font-size:14px;">🔴</span> Overdue <span style="font-size:11px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:normal;">${overdueTasks.length} tasks need attention</span></span>
      <span class="overdue-toggle ${overdueCollapsed ? 'collapsed' : ''}">▾</span>
    </div>
    <div class="overdue-body ${overdueCollapsed ? 'hidden' : ''}">
      ${groups.critical.length ? `<div class="overdue-age" style="color:var(--red);">14+ days (${groups.critical.length})</div>${groups.critical.map(renderItem).join("")}` : ""}
      ${groups.warning.length ? `<div class="overdue-age" style="color:var(--amber);">7–13 days (${groups.warning.length})</div>${groups.warning.map(renderItem).join("")}` : ""}
      ${groups.aging.length ? `<div class="overdue-age">1–6 days (${groups.aging.length})</div>${groups.aging.map(renderItem).join("")}` : ""}
    </div>
  `;
}

function toggleOverdue() {
  overdueCollapsed = !overdueCollapsed;
  renderOverdue();
}

// ── Onboarding filter — tags contain "onboarding" or "binder:90-day-checklist" ──
function isOnboarding(t) {
  const tags = (t.tags || "").toLowerCase();
  return tags.includes("onboarding") || tags.includes("binder:90-day-checklist");
}

// ── Detect onboarding phase from tags ──
function getOnboardPhase(t) {
  const tags = (t.tags || "").toLowerCase();
  if (tags.includes("30-day")) return "30-day";
  if (tags.includes("60-day")) return "60-day";
  if (tags.includes("90-day") || tags.includes("binder:90-day-checklist")) return "90-day";
  return "general";
}

let onboardCollapsed = false;

function renderOnboarding() {
  const tile = document.getElementById("onboard-tile");
  const obTasks = allTasks.filter(isOnboarding);
  if (!obTasks.length) { tile.style.display = "none"; return; }
  tile.style.display = "block";

  const done = obTasks.filter(t => t.status === "done").length;
  const total = obTasks.length;
  const pct = Math.round((done / total) * 100);

  const phases = [
    { key: "30-day", label: "30-Day" },
    { key: "60-day", label: "60-Day" },
    { key: "90-day", label: "90-Day" },
    { key: "general", label: "General" }
  ];

  const grouped = {};
  phases.forEach(p => grouped[p.key] = []);
  obTasks.forEach(t => {
    const phase = getOnboardPhase(t);
    grouped[phase].push(t);
  });

  // Sort: done last, then by priority
  const priOrder = { High: 0, Medium: 1, Low: 2 };
  phases.forEach(p => {
    grouped[p.key].sort((a, b) => {
      if (a.status === "done" && b.status !== "done") return 1;
      if (a.status !== "done" && b.status === "done") return -1;
      return (priOrder[a.priority] || 1) - (priOrder[b.priority] || 1);
    });
  });

  tile.innerHTML = `
    <div class="onboard-header" onclick="toggleOnboard()">
      <span class="onboard-title">
        <span style="font-size:14px;">📋</span> Onboarding Tracker
        <span style="font-size:11px;color:var(--text3);font-weight:400;text-transform:none;letter-spacing:normal;">${done} of ${total} complete</span>
      </span>
      <div class="onboard-progress">
        <div class="onboard-progress-bar"><div class="onboard-progress-fill" style="width:${pct}%"></div></div>
        <span class="onboard-progress-text">${pct}%</span>
        <span class="onboard-toggle ${onboardCollapsed ? 'collapsed' : ''}">▾</span>
      </div>
    </div>
    <div class="onboard-body ${onboardCollapsed ? 'hidden' : ''}">
      ${phases.map(p => {
        const items = grouped[p.key];
        if (!items.length) return "";
        const phaseDone = items.filter(t => t.status === "done").length;
        return `
          <div class="onboard-phase">
            <div class="onboard-phase-header">
              ${p.label}
              <span class="onboard-phase-count">${phaseDone}/${items.length}</span>
            </div>
            <div class="onboard-items">
              ${items.map(t => {
                const st = t.status === "done" ? "done" : t.status === "wip" ? "wip" : "todo";
                const stLabel = st === "done" ? "✓ Done" : st === "wip" ? "WIP" : "To Do";
                return `<div class="onboard-item ${st === 'done' ? 'done' : ''}" onclick="openTask(${t.id})">
                  <span class="onboard-item-title"><span class="task-id">#${t.id}</span> ${t.title}</span>
                  <span class="onboard-item-status ob-${st}">${stLabel}</span>
                </div>`;
              }).join("")}
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function toggleOnboard() {
  onboardCollapsed = !onboardCollapsed;
  renderOnboarding();
}

async function refreshAll() {
  const [tasksRes, peopleRes, statsRes, intelRes, sbRes] = await Promise.all([
    api("/tasks"), api("/people"), api("/stats"),
    api("/intel?fields=person_name,intel_type,content"),
    api("/scoreboard").catch(() => ({}))
  ]);
  allTasks = tasksRes.tasks || [];
  allPeople = peopleRes.people || [];
  allIntel = intelRes.intel || [];
  scoreboard = Array.isArray(sbRes) ? sbRes[0] || {} : sbRes || {};

  renderFocuses();
  renderOnboarding();

  renderBoard();
  renderPeople();
  renderMetrics();
  populateAssigneeSelect();
}

    <div class="stat-card"><div class="stat-label">To Do</div><div class="stat-value" style="color:var(--amber)">${statusMap.todo||0}</div></div>

// ── Board Rendering — three zones: My Tasks kanban, Waiting On, FYI ──
const COLUMNS = [
  { key: "todo", label: "To Do" },
  { key: "wip", label: "WIP" },
  { key: "done", label: "Done" },
  { key: "projects", label: "Projects" },
  { key: "undated", label: "Undated" }
];

function renderBoard() {
  const search = document.getElementById("search-tasks").value.toLowerCase();
  const pFilter = document.getElementById("filter-priority").value;
  const sFilter = document.getElementById("filter-source").value;
  const periodFilter = document.getElementById("filter-period").value;

  // Base filter (search + priority + source + period)
  const baseFilter = (t) => {
    if (search && !t.title.toLowerCase().includes(search) && !(t.description||"").toLowerCase().includes(search) && !(t.tags||"").toLowerCase().includes(search)) return false;
    if (pFilter && t.priority !== pFilter) return false;
    if (sFilter && t.source !== sFilter) return false;
    if (periodFilter && t.target_period !== periodFilter) return false;
    return true;
  };

  // ZONE 1: Kanban — only MY tasks (not waiting on someone, not onboarding)
  const myTasks = allTasks.filter(t => t.ownership !== "fyi" && !t.waiting_on && !isOnboarding(t) && baseFilter(t));

  const kanban = document.getElementById("kanban");
  const today = new Date().toISOString().split("T")[0];
  const soon = new Date(Date.now() + 2*86400000).toISOString().split("T")[0];

  kanban.innerHTML = COLUMNS.map(col => {
    const tasks = myTasks.filter(t => t.status === col.key);
    // Build intel tooltip for a person name
    const getIntelTip = (name) => {
      if (!name || !allIntel.length) return "";
      const matches = allIntel.filter(i => i.person_name && i.person_name.toLowerCase() === name.toLowerCase());
      if (!matches.length) return "";
      const person = allPeople.find(p => p.name.toLowerCase() === name.toLowerCase());
      const lines = [];
      if (person?.strength) lines.push(`<div class="intel-label">Style</div>${person.strength}`);
      if (person?.go_to_for) lines.push(`<div class="intel-label">Go to for</div>${person.go_to_for}`);
      const ws = matches.find(m => m.intel_type === "working_style");
      if (ws) lines.push(`<div class="intel-label">Working style</div>${ws.content?.substring(0, 120) || ""}`);
      const pol = matches.find(m => m.intel_type === "political" || m.intel_type === "relationship");
      if (pol) lines.push(`<div class="intel-label">${pol.intel_type}</div>${pol.content?.substring(0, 120) || ""}`);
      if (!lines.length) return "";
      return `<span class="intel-badge" title="${matches.length} intel entries">👤 ${matches.length}</span><div class="intel-tip">${lines.join("<div style='margin-top:4px;'></div>")}</div>`;
    };

    // Render a single task card
    const cardHtml = (t) => {
      let badges = "";
      if (t.due_date && t.due_date < today && t.status !== "done") badges += `<span class="task-tag overdue">overdue</span>`;
      else if (t.due_date && t.due_date <= soon && t.status !== "done") badges += `<span class="task-tag due-soon">due soon</span>`;
      if (t.target_period) badges += `<span class="task-tag period">${t.target_period}</span>`;
      if (t.knowledge_type === "tribal-knowledge") badges += `<span class="task-tag tribal">tribal</span>`;
      if (t.completion_reason) badges += `<span class="task-tag" style="background:var(--teal-bg);color:var(--teal)">${t.completion_reason}</span>`;
      if (t.assignee_name) badges += `<span class="task-assignee">${t.assignee_name}</span>`;
      if (t.tags) { t.tags.split(",").slice(0,2).forEach(tag => { badges += `<span class="task-tag">${tag.trim()}</span>`; }); }
      // Intel badge — match on assignee or waiting_on
      const intelName = t.assignee_name || t.waiting_on;
      const intelHtml = getIntelTip(intelName);
      return `<div class="task-card priority-${t.priority}" onclick="openTask(${t.id})">
        <div class="task-title"><span class="task-id">#${t.id}</span> ${t.title}</div>
        <div class="task-meta">${badges}${intelHtml}</div>
      </div>`;
    };

    // Week label from a date string (Mon-Sun weeks)
    const weekOf = (dateStr) => {
      if (!dateStr) return null;
      const d = new Date(dateStr.replace(" ", "T") + (dateStr.includes("T") ? "" : "Z"));
      const day = d.getUTCDay();
      const mon = new Date(d);
      mon.setUTCDate(d.getUTCDate() - ((day + 6) % 7));
      const m = mon.toLocaleString("en-US", { month: "short", timeZone: "UTC" });
      return `Week of ${m} ${mon.getUTCDate()}`;
    };
    const weekSortKey = (dateStr) => {
      if (!dateStr) return "";
      const d = new Date(dateStr.replace(" ", "T") + (dateStr.includes("T") ? "" : "Z"));
      const day = d.getUTCDay();
      const mon = new Date(d);
      mon.setUTCDate(d.getUTCDate() - ((day + 6) % 7));
      return mon.toISOString().split("T")[0];
    };

    let cardsHtml;
    if (col.key === "done") {
      // Group done tasks by week of completion, most recent first
      const groups = {};
      tasks.forEach(t => {
        const wk = weekOf(t.completed_at || t.updated_at) || "Unknown";
        (groups[wk] = groups[wk] || []).push(t);
      });
      const sortedWeeks = Object.keys(groups).sort((a, b) => {
        const aDate = groups[a][0].completed_at || groups[a][0].updated_at || "";
        const bDate = groups[b][0].completed_at || groups[b][0].updated_at || "";
        return bDate.localeCompare(aDate);
      });
      cardsHtml = sortedWeeks.map(wk =>
        `<div class="week-divider">${wk} (${groups[wk].length})</div>` +
        groups[wk].map(cardHtml).join("")
      ).join("");
    } else if (col.key === "todo" || col.key === "wip") {
      // Group todo/wip by due_date week, soonest first; no-date at bottom
      const groups = {};
      const sortKeys = {};
      tasks.forEach(t => {
        const wk = weekOf(t.due_date) || "No Due Date";
        const sk = weekSortKey(t.due_date) || "9999";
        (groups[wk] = groups[wk] || []).push(t);
        if (!sortKeys[wk] || sk < sortKeys[wk]) sortKeys[wk] = sk;
      });
      const sortedWeeks = Object.keys(groups).sort((a, b) => (sortKeys[a] || "9999").localeCompare(sortKeys[b] || "9999"));
      cardsHtml = sortedWeeks.map(wk =>
        `<div class="week-divider">${wk} (${groups[wk].length})</div>` +
        groups[wk].sort((a, b) => (a.due_date || "9999").localeCompare(b.due_date || "9999")).map(cardHtml).join("")
      ).join("");
    } else {
      cardsHtml = tasks.map(cardHtml).join("");
    }

    return `
      <div class="column">
        <div class="col-header">
          <span class="col-title">${col.label}</span>
          <span class="col-count">${tasks.length}</span>
        </div>
        <div class="col-cards">${cardsHtml}</div>
      </div>`;
  }).join("");

  // ZONE 2: Waiting On — any of MY tasks that are blocked, with days-waiting
  const waitingTasks = allTasks.filter(t => t.waiting_on && t.ownership !== "fyi" && t.status !== "done" && !isOnboarding(t));
  document.getElementById("waiting-count").textContent = waitingTasks.length;
  document.getElementById("waiting-list").innerHTML = waitingTasks.length ? waitingTasks.map(t => {
    const created = t.updated_at || t.created_at;
    const daysWaiting = created ? Math.floor((Date.now() - new Date(created)) / 86400000) : 0;
    const urgency = daysWaiting >= 14 ? "urgent" : daysWaiting >= 7 ? "warning" : "stale";
    return `
    <div class="zone-item priority-${t.priority}" onclick="openTask(${t.id})">
      <div class="zone-item-left">
        <div class="zone-item-title"><span class="task-id">#${t.id}</span> ${t.title}</div>
        <div class="zone-item-sub">${t.target_period || ""} ${t.status === "wip" ? "· in progress" : ""}</div>
      </div>
      <div class="zone-item-right">
        <span class="waiting-who">⏳ ${t.waiting_on}</span>
        <span class="days-badge ${urgency}">${daysWaiting}d waiting</span>
      </div>
    </div>`;
  }).join("") : "";

  // ZONE 3: FYI / Tracking — with 30-day archive cutoff
  const allFyi = allTasks.filter(t => t.ownership === "fyi" && t.status !== "done");
  const thirtyDaysAgo = new Date(Date.now() - 30 * 86400000).toISOString().split("T")[0];
  const recentFyi = allFyi.filter(t => {
    const lastTouch = t.updated_at || t.created_at || "";
    return lastTouch >= thirtyDaysAgo || t.status === "wip" || t.status === "projects";
  });
  const archivedFyi = allFyi.filter(t => !recentFyi.includes(t));
  const displayFyi = showArchivedFyi ? allFyi : recentFyi;

  document.getElementById("fyi-count").textContent = displayFyi.length;
  document.getElementById("fyi-archived-count").textContent = archivedFyi.length ? `${archivedFyi.length} archived` : "";
  document.getElementById("fyi-archive-toggle").textContent = showArchivedFyi ? "Hide archived" : `Show archived (${archivedFyi.length})`;
  document.getElementById("fyi-archive-toggle").style.display = archivedFyi.length ? "inline-block" : "none";

  document.getElementById("fyi-list").innerHTML = displayFyi.length ? displayFyi.map(t => {
    const statusLabel = t.status === "wip" ? "WIP" : t.status === "todo" ? "To Do" : t.status === "projects" ? "Project" : t.status;
    const lastTouch = t.updated_at || t.created_at || "";
    const isArchived = archivedFyi.includes(t);
    return `
    <div class="zone-item priority-${t.priority}" onclick="openTask(${t.id})" style="opacity:${isArchived ? '0.4' : '0.8'};">
      <div class="zone-item-left">
        <div class="zone-item-title"><span class="task-id">#${t.id}</span> ${t.title}</div>
        <div class="zone-item-sub">${t.assignee_name ? t.assignee_name + " · " : ""}${t.target_period || ""}</div>
      </div>
      <div class="zone-item-right">
        <span class="fyi-status">${statusLabel}</span>
        ${isArchived ? '<span class="task-tag" style="font-size:9px;opacity:0.6;">30d+</span>' : ""}
        ${t.knowledge_type === "tribal-knowledge" ? '<span class="task-tag tribal" style="font-size:10px;">tribal</span>' : ""}
      </div>
    </div>
  `}).join("") : "";
}

let pendingCompleteBody = null;

// Suggest most likely completion outcome based on task title/tags
function suggestOutcome(title, tags) {
  const t = ((title || "") + " " + (tags || "")).toLowerCase();
  if (/\b(talk|ask|check with|meet|intro|1.on.1|discuss)\b/.test(t)) return "conversation";
  if (/\b(submit|deliver|send|email|turn in|hand off)\b/.test(t)) return "delivered";
  if (/\b(wsra|method.sheet|walkthrough|audit|inspect|observation|lpa)\b/.test(t)) return "findings documented";
  if (/\b(fix|repair|correct|resolve|close out)\b/.test(t)) return "issue resolved";
  return "no issues";
}

async function saveTask() {
  const body = {
    title: document.getElementById("m-title").value,
    description: document.getElementById("m-desc").value || null,
    notes: document.getElementById("m-notes").value || null,
    priority: document.getElementById("m-priority").value,
    status: document.getElementById("m-status").value,
    due_date: document.getElementById("m-due").value || null,
    assignee_id: document.getElementById("m-assignee").value || null,
    tags: document.getElementById("m-tags").value || null,
    ownership: document.getElementById("m-ownership").value || "mine",
    target_period: document.getElementById("m-target-period").value || null,
    waiting_on: document.getElementById("m-waiting-on").value || null,
    knowledge_type: document.getElementById("m-knowledge-type").value || null
  };
  if (!body.title) return alert("Title required");

  // Intercept: existing task changing to "done" from something else
  if (editingTaskId && body.status === "done" && originalStatus !== "done") {
    pendingCompleteBody = body;
    document.getElementById("complete-task-title").textContent = body.title;
    document.getElementById("c-outcome").value = suggestOutcome(body.title, body.tags);
    document.getElementById("c-who").value = "";
    document.getElementById("c-note").value = "";
    closeModal();
    document.getElementById("complete-modal").classList.add("open");
    return;
  }

  await doSave(body);
}

async function doSave(body) {
  if (editingTaskId) {
    await api(`/tasks/${editingTaskId}`, "PATCH", body);
  } else {
    await api("/tasks", "POST", body);
  }
  closeModal();
  document.getElementById("complete-modal").classList.remove("open");
  refreshAll();
}

function skipComplete() {
  if (!pendingCompleteBody) { document.getElementById("complete-modal").classList.remove("open"); return; }
  doSave(pendingCompleteBody);
  pendingCompleteBody = null;
}

function confirmComplete() {
  if (!pendingCompleteBody) return;
  const outcome = document.getElementById("c-outcome").value;
  const who = document.getElementById("c-who").value.trim();
  const note = document.getElementById("c-note").value.trim();

  // Structured fields — no more string parsing
  if (outcome) pendingCompleteBody.completion_reason = outcome;
  if (who) pendingCompleteBody.completion_people = who;
  if (note) {
    const existing = pendingCompleteBody.notes || "";
    pendingCompleteBody.notes = note + (existing ? "\n" + existing : "");
  }

  doSave(pendingCompleteBody);
  pendingCompleteBody = null;
}

async function deleteTask() {
  if (!editingTaskId || !confirm("Delete this task?")) return;
  await api(`/tasks/${editingTaskId}`, "DELETE");
  closeModal();
  refreshAll();
}

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ehs-cmd-export-${new Date().toISOString().split("T")[0]}.json`;

// ── People Rendering ──
function renderPeople() {
  const search = document.getElementById("search-people").value.toLowerCase();
  const dept = document.getElementById("filter-dept").value;
  const rel = document.getElementById("filter-reliability").value;

  let filtered = allPeople.filter(p => {
    if (search && !p.name.toLowerCase().includes(search) && !(p.expertise||"").toLowerCase().includes(search) && !(p.go_to_for||"").toLowerCase().includes(search) && !(p.notes||"").toLowerCase().includes(search)) return false;
    if (dept && p.department !== dept) return false;
    if (rel && p.reliability !== rel) return false;
    return true;
  });

  const grid = document.getElementById("people-grid");
  grid.innerHTML = filtered.map(p => {
    const deptClass = getDeptClass(p.department);
    const relClass = p.reliability === "proven" ? "rel-proven" : p.reliability === "emerging" ? "rel-emerging" : "rel-watching";
    const hasWarning = (p.notes || "").includes("WARNING:");
    const warningText = hasWarning ? p.notes.split("WARNING:")[1].split(".")[0].trim() : "";
    const cleanNotes = hasWarning ? p.notes.replace(/WARNING:[^.]+\.?\s*/g, "").trim() : (p.notes || "");

    return `<div class="person-card">
      <div class="person-header">
        <div>
          <div class="person-name">${p.name}</div>
          <div class="person-role">${p.area || ""}</div>
        </div>
        <div style="display:flex;gap:4px;align-items:center;">
          <span class="reliability-badge ${relClass}">${p.reliability}</span>
          <span class="person-dept ${deptClass}">${p.department || ""}</span>
        </div>
      </div>
      <div class="person-body">
        ${p.strength ? `<div class="person-field"><div class="person-field-label">Strength / Style</div><div class="person-field-value">${p.strength}</div></div>` : ""}
        ${p.go_to_for ? `<div class="person-field"><div class="person-field-label">Go to for</div><div class="person-field-value">${p.go_to_for}</div></div>` : ""}
        ${p.expertise ? `<div class="person-field"><div class="person-field-label">Expertise</div><div class="person-field-value">${p.expertise}</div></div>` : ""}
        ${cleanNotes ? `<div class="person-field"><div class="person-field-label">Notes</div><div class="person-field-value">${cleanNotes}</div></div>` : ""}
        ${hasWarning ? `<div class="person-warning">⚠ ${warningText}</div>` : ""}
        ${p.active_tasks > 0 ? `<div class="person-tasks-count" style="margin-top:6px;">${p.active_tasks} active task${p.active_tasks>1?"s":""}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function getDeptClass(dept) {
  if (!dept) return "dept-default";
  if (dept.includes("EHS")) return "dept-EHS";
  if (dept.includes("Operations")) return "dept-Operations";
  if (dept.includes("Supply") || dept.includes("Logistics")) return "dept-Supply";
  if (dept === "CI") return "dept-CI";
  if (dept === "Leadership") return "dept-Leadership";
  if (dept === "Security") return "dept-Security";
  return "dept-default";
}

// ── EHS Metrics Panel — rebuilt with all conversation data ──
function renderMetrics() {
  const grid = document.getElementById("metrics-grid");
  const s = scoreboard;
  const live = '<span class="metric-source source-validated">live</span>';
  const target = '<span class="metric-source source-conv">target</span>';

  const now = new Date();
  const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  const pctYear = Math.round(dayOfYear / 365 * 100);

  const manHours = s.man_hours_ytd || 0;
  const manTarget = s.man_hours_target || 1000000;
  const pctToMillion = Math.min(100, (manHours / manTarget * 100)).toFixed(0);
  const trir = s.trir != null ? s.trir : '—';
  const trirColor = trir === '—' ? '' : (trir <= 0.65 ? 'green' : trir <= 1.0 ? 'amber' : 'red');

// ── Otter Extract — now also extracts leadership moves ──
async function extractOtter() {
  const transcript = document.getElementById("otter-input").value.trim();
  if (!transcript) return;
  const btn = document.getElementById("otter-btn");
  const status = document.getElementById("otter-status");
  btn.disabled = true;
  status.textContent = "Extracting tasks and leadership moves...";
  try {
    const data = await api("/otter/extract", "POST", { transcript });
    const list = document.getElementById("extracted-list");
    const tasks = data.extracted_tasks || data.extracted || [];
    const moves = data.extracted_moves || [];
    if (!tasks.length && !moves.length) { status.textContent = "No tasks or moves found."; return; }
    status.textContent = `Found ${tasks.length} tasks, ${moves.length} leadership moves`;
    let html = "";
    // Tasks
    if (tasks.length) {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text3);margin-top:8px;">Tasks</div>`;
      html += tasks.map((t, i) => `
        <div class="extracted-item" id="ext-${i}">
          <div class="extracted-info">
            <div class="extracted-title">${t.title}</div>
            <div class="extracted-desc">${t.description || ""} ${t.priority ? `· ${t.priority}` : ""} ${t.assignee_hint ? `· ${t.assignee_hint}` : ""} ${t.ownership === "fyi" ? "· <em>FYI</em>" : ""} ${t.waiting_on ? `· ⏳ ${t.waiting_on}` : ""} ${t.target_period ? `· ${t.target_period}` : ""}</div>
          </div>
          <button class="btn btn-sm btn-primary" onclick="addExtracted(${i})">Add</button>
        </div>
      `).join("");
    }
    // Leadership moves
    if (moves.length) {
      html += `<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--purple);margin-top:16px;">Leadership Moves</div>`;
      html += moves.map((m, i) => `
        <div class="extracted-item" id="move-${i}" style="border-left:2px solid var(--purple);">
          <div class="extracted-info">
            <div class="extracted-title">${m.description}</div>
            <div class="extracted-desc">${m.category || ""} ${m.context ? `· ${m.context}` : ""} ${m.people_involved ? `· ${m.people_involved}` : ""}</div>
          </div>
          <button class="btn btn-sm" style="border-color:var(--purple);color:var(--purple);" onclick="addMove(${i})">Log</button>
        </div>
      `).join("");
    }
    list.innerHTML = html;
    window._extractedTasks = tasks;
    window._extractedMoves = moves;
  } catch (e) {
    status.textContent = "Error: " + (e.message || "try again");
  } finally {
    btn.disabled = false;
  }
}

async function addExtracted(i) {
  const t = window._extractedTasks[i];
  if (!t) return;
  let assigneeId = null;
  if (t.assignee_hint) {
    const match = allPeople.find(p => p.name.toLowerCase().includes(t.assignee_hint.toLowerCase()));
    if (match) assigneeId = match.id;
  }
  await api("/tasks", "POST", {
    title: t.title,
    description: t.description || null,
    due_date: t.due_date || null,
    priority: t.priority || "Medium",
    status: "todo",
    assignee_id: assigneeId,
    source: "otter-extract",
    ai_extracted: true,
    ownership: t.ownership || "mine",
    waiting_on: t.waiting_on || null,
    knowledge_type: t.knowledge_type || null,
    target_period: t.target_period || null
  });
  document.getElementById("ext-" + i).style.opacity = "0.3";
  document.getElementById("ext-" + i).querySelector("button").disabled = true;
  document.getElementById("ext-" + i).querySelector("button").textContent = "Added ✓";
  refreshAll();
}

async function addMove(i) {
  const m = window._extractedMoves[i];
  if (!m) return;
  await api("/moves", "POST", {
    description: m.description,
    category: m.category || "proactive",
    context: m.context || null,
    people_involved: m.people_involved || null
  });
  document.getElementById("move-" + i).style.opacity = "0.3";
  document.getElementById("move-" + i).querySelector("button").disabled = true;
  document.getElementById("move-" + i).querySelector("button").textContent = "Logged ✓";
}

// ── Click outside modal to close ──
document.getElementById("task-modal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("task-modal")) closeModal();
});

// ── Boot ──
boot();
</script>
